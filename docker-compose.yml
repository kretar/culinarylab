services:
  db:
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wordpress", "-psomewordpress"]
      interval: 5s
      timeout: 5s
      retries: 5

  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    ports:
      - "8080:80"
    restart: always
    volumes:
      - wp_data:/var/www/html
      - ./masterchef:/var/www/html/wp-content/themes/masterchef
      - ./recipe-plugin:/var/www/html/wp-content/plugins/recipe-plugin
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1

  # One-shot provisioning: installs WordPress, activates theme/plugin, adds sample content.
  # Re-runs on every `docker-compose up` and skips what is already done.
  setup:
    depends_on:
      - wordpress
    image: wordpress:cli
    user: "33:33"  # same uid as www-data in the wordpress image
    restart: "no"
    entrypoint: ["sh", "/setup.sh"]
    volumes:
      - wp_data:/var/www/html
      - ./masterchef:/var/www/html/wp-content/themes/masterchef
      - ./recipe-plugin:/var/www/html/wp-content/plugins/recipe-plugin
      - ./docker/setup.sh:/setup.sh:ro
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress

volumes:
  db_data: {}
  wp_data: {}
